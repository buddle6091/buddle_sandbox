# lefthook - 커밋/푸시 전 게이트 (Nx 모노레포용)
# 설치(게이트 활성화): npm i -D lefthook && npx lefthook install
# 참고: --base는 기본 브랜치(master)에 맞춰 조정. origin/master 가 없으면 nx 기본(NX_BASE)을 따른다.

pre-commit:
  parallel: true
  commands:
    lint-test-typecheck:
      # 변경 영향 범위만 검증 -> 빠르고, "검증 전 완료 선언" 방지
      run: npx nx affected -t lint test typecheck --base=origin/master --head=HEAD

pre-push:
  commands:
    build:
      run: npx nx affected -t build --base=origin/master --head=HEAD

# 팁:
# - Claude Code가 커밋을 만들 때도 이 훅이 동일하게 적용된다(에이전트가 게이트를 우회 못 함).
# - E2E(Playwright)는 무거우니 커밋 훅이 아니라 CI(PR)에서 돌린다.
# - 초기 단계에 test가 느리면 pre-commit은 lint+typecheck만, test는 pre-push로 옮겨도 된다.
